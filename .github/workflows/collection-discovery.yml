name: Official catalogs and three-source discovery (no paid search)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 0,4 * * *'
permissions:
  contents: read
concurrency:
  group: journal-production
  cancel-in-progress: false
jobs:
  discover:
    # OFF until explicitly enabled. Does not restart any legacy paid workflow.
    if: vars.JOURNAL_DISCOVERY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Offline regression tests
        run: npm test
      - name: Collect independent sources and verify each article with DeepSeek
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/discover-collection.js --run --save-sources
      - name: Save formal library and reminders only
        if: always()
        run: |
          node scripts/stage-collection-discovery.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: save discovery signals and independent source collection'
            git push origin HEAD:refs/heads/master
          fi
      - name: Translate newly collected fields using the shared GitHub queue
        if: vars.JOURNAL_CLOUD_PUBLICATION_ENABLED == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/publish-collection.js
      - name: Build website with direct-read status and browser reminders
        id: build
        run: node scripts/build-journal-site.js --github-output
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ steps.build.outputs.directory }}
          include-hidden-files: true
  deploy:
    if: vars.JOURNAL_PAGES_ENABLED == 'true'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
