{
  "name": "Translate existing library automatically and publish",
  "on": { "workflow_dispatch": {} },
  "permissions": { "contents": "read" },
  "concurrency": { "group": "journal-production", "cancel-in-progress": false },
  "jobs": {
    "translate": {
      "if": "vars.JOURNAL_TRANSLATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "permissions": { "contents": "write" },
      "outputs": { "translation_attention": "${{ steps.translate.outputs.attention }}" },
      "steps": [
        { "name": "Checkout current default branch including durable request ledger", "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", "with": { "ref": "${{ github.event.repository.default_branch }}", "persist-credentials": true } },
        { "name": "Set up Node.js 24", "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", "with": { "node-version": "24", "package-manager-cache": false } },
        { "name": "Install locked dependencies without lifecycle scripts", "run": "npm ci --ignore-scripts" },
        { "name": "Run offline tests", "run": "npm test" },
        { "name": "Validate formal library and show pending automatic queue", "run": "node scripts/journal-library.js --validate\nnode scripts/translate-library.js --status" },
        { "name": "Translate existing library with durable reservations and automatic import", "id": "translate",
          "env": { "DEEPSEEK_API_KEY": "${{ secrets.DEEPSEEK_API_KEY }}", "JOURNAL_TRANSLATION_ENABLED": "${{ vars.JOURNAL_TRANSLATION_ENABLED }}", "DATA_BRANCH": "${{ github.event.repository.default_branch }}" },
          "run": "node scripts/translate-library.js --run --mode backfill --github-output" },
        { "name": "Validate accepted translations", "run": "node scripts/journal-library.js --validate" },
        { "name": "Build static website from saved translations only", "id": "build", "run": "node scripts/build-journal-site.js --github-output" },
        { "name": "Check existing Pages configuration", "if": "vars.JOURNAL_PAGES_ENABLED == 'true'", "uses": "actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b" },
        { "name": "Upload website ONLY", "if": "vars.JOURNAL_PAGES_ENABLED == 'true'", "uses": "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9", "with": { "path": "${{ steps.build.outputs.directory }}", "include-hidden-files": true } }
      ]
    },
    "deploy": {
      "if": "vars.JOURNAL_PAGES_ENABLED == 'true'", "needs": "translate", "runs-on": "ubuntu-latest", "timeout-minutes": 15,
      "permissions": { "pages": "write", "id-token": "write" },
      "environment": { "name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}" },
      "steps": [{ "name": "Deploy accepted translations", "id": "deployment", "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e" }]
    },
    "report_translation_attention": {
      "if": "always() && needs.translate.outputs.translation_attention == 'true'", "needs": ["translate", "deploy"],
      "runs-on": "ubuntu-latest", "timeout-minutes": 5, "permissions": {},
      "steps": [{ "name": "Report held translations", "run": "echo 'Some translations are held or paused; accepted translations were preserved. Inspect the summary before any retry.'\nexit 1" }]
    }
  }
}
