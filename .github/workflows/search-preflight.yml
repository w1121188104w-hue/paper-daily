{
  "name": "Search API preflight (no publication)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "pilot": {
          "description": "隔离AER联合试跑：最多6次Pro、4次免费Serp、3篇字段补全，不翻译不发布",
          "type": "boolean",
          "default": false
        },
        "account_only": {
          "description": "只读检查免费账户，不消耗任何搜索次数",
          "type": "boolean",
          "default": true
        },
        "retry_unknown": {
          "description": "已获授权再次诊断；旧的未知计费仍保留，每次运行最多1次Pro请求",
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "journal-production",
    "cancel-in-progress": false
  },
  "jobs": {
    "preflight": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "Checkout reviewed search code only",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "33b627fbd1f0b1b8b07b65d1c9fe14cf9e98ee6a",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js 24",
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Run offline tests before accessing credentials",
          "run": "npm test"
        },
        {
          "name": "Run explicitly selected bounded verification mode (no publication)",
          "env": {
            "ZHIPU_API_KEY": "${{ secrets.ZHIPU_API_KEY }}",
            "SERPAPI_API_KEY": "${{ secrets.SERPAPI_API_KEY }}",
            "GITHUB_TOKEN": "${{ github.token }}",
            "ACCOUNT_ONLY": "${{ inputs.account_only }}",
            "RETRY_UNKNOWN": "${{ inputs.retry_unknown }}",
            "PILOT": "${{ inputs.pilot }}"
          },
          "run": "if [ \"$PILOT\" = \"true\" ]; then\n  node scripts/search-pilot.js --run\nelif [ \"$ACCOUNT_ONLY\" = \"true\" ]; then\n  node scripts/search-preflight.js --account-only\nelif [ \"$RETRY_UNKNOWN\" = \"true\" ]; then\n  node scripts/search-preflight.js --run --retry-unknown\nelse\n  node scripts/search-preflight.js --run\nfi"
        }
      ]
    }
  }
}
