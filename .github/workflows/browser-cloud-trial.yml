name: Journal browser cloud comparison (isolated, no import)
on:
  push:
    branches: [codex/github-browser-trial-20261003]
    paths:
      - .github/workflows/browser-cloud-trial.yml
      - tools/selenium-pilot/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: browser-cloud-trial
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/browser-abstract-extension
            tools/selenium-pilot
      - name: Create an isolated environment with the runner Python
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/paper-trial-venv"
          echo "$RUNNER_TEMP/paper-trial-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the same browser collection libraries
        run: python -m pip install --disable-pip-version-check -r tools/selenium-pilot/requirements-cdp.txt
      - name: Verify extraction rules and browser availability
        run: |
          node tools/selenium-pilot/github-trial-bridge.mjs verify tools/selenium-pilot/github-trial-plan.json
          python -m unittest discover -s tools/selenium-pilot -p 'test_*.py' -v
          command -v microsoft-edge
          command -v xvfb-run
          microsoft-edge --version
      - name: Diagnose browser startup without visiting a publisher
        run: |
          set +e
          timeout 12s xvfb-run -a microsoft-edge --user-data-dir="$RUNNER_TEMP/edge-startup-check" --no-first-run --remote-debugging-port=9229 about:blank
          status=$?
          echo "Browser startup probe exit: $status (124 means it kept running)"
          exit 0
      - name: Read the fixed 19-journal sample with a visible browser on Xvfb
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          xvfb-run -a --server-args='-screen 0 1280x900x24' python -X utf8 tools/selenium-pilot/github-trial.py --plan tools/selenium-pilot/github-trial-plan.json --output trial-output --profile "$RUNNER_TEMP/paper-browser-profile" --binary "$(command -v microsoft-edge)" --interval 3
      - name: Preserve partial results even if collection fails
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: browser-cloud-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: trial-output/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
