<body><main><h1>论文采集 · 正式流程</h1><p>日常只读被提醒的目录；每周或每两周手动进行一次全刊巡检。旧测试数据不会被覆盖。</p>
<section><p id="status" role="status">连接本地正式流程服务……</p><button id="refresh">刷新任务</button>
<button id="daily" disabled>日常增量采集</button><button id="full" disabled>全刊巡检（最新一期＋在线发表）</button>
<p>没有提醒不代表没有新论文。全刊巡检不等于全部历史卷期回溯；未完成的目录和论文会保留。</p><div id="tasks"></div></section>
<section><h2>本机批次与发布</h2><p>采集后回到这里，点击“导入、翻译并发布”。仅翻译新增或缺失内容，密钥继续使用本机已保存的配置。旧线上采集和搜索不会被重新启用。</p><div id="runs"></div></section>
