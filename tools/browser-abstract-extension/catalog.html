<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目录采集</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="tag">PAPER DAILY</span><h1>① 目录采集</h1><p>官网已完整读取的目录不重复打开。目录完成后自动核对原文，再采集新增与到期未完成论文。</p><a href="workflow.html">返回采集首页</a></header>
<section><p id="status" role="status"></p><p id="current"></p><p id="counts"></p><div class="buttons"><button id="start" disabled>继续</button><button id="pause" disabled>暂停</button><button id="skip" disabled>跳过当前目录</button></div>
<p>请保留任务面板。遇验证码后手动处理，程序会自动检测并继续；不会点击或绕过验证码。</p>
<p><a id="manual-link" target="_blank" rel="noopener noreferrer" hidden>自动打不开？手动打开当前目录 ↗</a>，然后点扩展的“读取本页并继续任务”。</p>
<details><summary>恢复与备份</summary><button id="retry" disabled>重试未完成目录</button><button id="recheck" disabled>重新读取本批次（保留历史）</button><button id="export">导出本机备份</button></details></section>
<section><h2>原文核对</h2><p id="ai-status" role="status"></p><button id="ai-run">继续待核对</button><button id="ai-stop" disabled>暂停核对</button><p>自动开始；仅引用原文，不生成缺失字段。成功结果复用缓存。</p></section>
<section><h2>目录结果</h2><label>显示范围 <select id="collection-filter"><option value="all">全部</option><option value="issue">最新一期</option><option value="online">在线发表</option></select></label><div id="catalogs"></div></section>
</main><script type="module" src="catalog-dashboard.js"></script></body></html>
