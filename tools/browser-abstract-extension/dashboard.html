<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>详情采集</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="tag">PAPER DAILY</span><h1>② 增量详情采集</h1><p>仅采集新增与到期未完成论文。原文核对后自动提交，GitHub 翻译并发布。</p><a href="workflow.html">返回采集首页</a></header>
<section><p id="status" role="status"></p><p id="current"></p><p id="counts"></p><p id="workflow-message" role="status"></p>
<div class="buttons"><button id="start" disabled>继续</button><button id="pause" disabled>暂停</button><button id="skip" disabled>跳过当前篇</button></div>
<p>保留此面板；遇验证码手动完成后会自动继续。原文没有独立摘要时留空，不让 AI 编造。</p>
<p><a id="manual-link" target="_blank" rel="noopener noreferrer" hidden>手动打开当前论文 ↗</a>，再点扩展“读取本页并继续任务”。</p>
<details><summary>恢复与备份</summary><button id="retry">重试未完成项</button><button id="recheck">重新读取本队列</button><button id="export">导出本机备份</button></details></section>
<section><h2>原文核对</h2><p id="ai-status" role="status"></p><button id="ai-run">继续待核对</button><button id="ai-stop" disabled>暂停核对</button><p>自动开始、复用缓存；只能选择原文片段。核对 Key 在本机加密保存，翻译 Key 由 GitHub 保管。</p></section>
<section><h2 id="queue-title">详情队列</h2><div id="papers"></div></section>
</main><script type="module" src="dashboard.js"></script></body></html>
